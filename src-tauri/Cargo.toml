[package]
name = "drivedesk"
version = "0.1.0"
description = "Google Drive desktop client"
authors = ["DriveDesk"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "drivedesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Serves the bundled `dist/` through tauri://localhost. `tauri build` enables
# this automatically; a plain `cargo build --release` must pass it explicitly.
default = []
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures-util = "0.3"
thiserror = "2"
url = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
percent-encoding = "2"
mime_guess = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
